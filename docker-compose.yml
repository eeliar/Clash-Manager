services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/clashmanager.db}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
