server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /auth {
        proxy_pass http://backend:8000/auth;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /profiles {
        proxy_pass http://backend:8000/profiles;
    }

    location /devices {
        proxy_pass http://backend:8000/devices;
    }

    location /revisions {
        proxy_pass http://backend:8000/revisions;
    }

    location /proxies {
        proxy_pass http://backend:8000/proxies;
    }

    location /sources {
        proxy_pass http://backend:8000/sources;
    }

    location /groups {
        proxy_pass http://backend:8000/groups;
    }

    location /rules {
        proxy_pass http://backend:8000/rules;
    }

    location /config {
        proxy_pass http://backend:8000/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sub {
        proxy_pass http://backend:8000/sub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }
}
